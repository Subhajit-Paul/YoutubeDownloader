name: Build Android APK

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      # Buildozer works best with Python 3.11 (3.13 support is experimental)
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip zlib1g-dev \
            autoconf libtool pkg-config automake \
            libffi-dev libssl-dev \
            ccache

      - name: Install buildozer and cython
        run: pip install buildozer==1.5.0 cython==3.0.11

      - name: Cache buildozer global directory
        uses: actions/cache@v5
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      # A release build is what makes android:debuggable false. Signing uses the
      # repo keystore when present; otherwise a throwaway key is generated so the
      # artefact is still installable for testing. Only a keystore-signed build
      # can be shipped to users, because upgrades require a stable signature.
      - name: Prepare signing key
        env:
          # Passed as env, never interpolated into the script body: a secret
          # containing shell metacharacters would otherwise be executable.
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
            {
              echo "P4A_RELEASE_KEYSTORE=$KS"
              echo "P4A_RELEASE_KEYALIAS=$KEYSTORE_ALIAS"
              echo "P4A_RELEASE_KEYSTORE_PASSWD=$KEYSTORE_PASSWORD"
              echo "P4A_RELEASE_KEYALIAS_PASSWD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore "$KS" \
              -alias ci -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass cicicici -keypass cicicici \
              -dname "CN=CI Test Build, O=YoutubeDownloader, C=US"
            {
              echo "P4A_RELEASE_KEYSTORE=$KS"
              echo "P4A_RELEASE_KEYALIAS=ci"
              echo "P4A_RELEASE_KEYSTORE_PASSWD=cicicici"
              echo "P4A_RELEASE_KEYALIAS_PASSWD=cicicici"
            } >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret set — signed with a throwaway key. Installable for testing, but not upgradeable; set the secret before shipping to users."
          fi

      - name: Build release APK
        working-directory: android
        run: yes | buildozer android release
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache

      - name: Find built APK
        id: find_apk
        working-directory: android
        run: |
          set -euo pipefail
          APK=$(find bin -name "*.apk" ! -name "*unsigned*" | head -1)
          [ -n "$APK" ] || APK=$(find bin -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No APK in android/bin — buildozer produced: $(ls bin 2>/dev/null)"
            exit 1
          fi
          echo "apk_path=android/$APK" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename $APK)" >> "$GITHUB_OUTPUT"

      # Gates the build on device-compatibility and security properties of the
      # artefact: 16 KB alignment, target SDK, EOL TLS, debuggability, ffmpeg.
      - name: Audit APK
        run: |
          set -o pipefail   # without this, tee's exit code hides an audit failure
          pip install androguard
          python tools/check_apk.py "${{ steps.find_apk.outputs.apk_path }}" --strict \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: false
