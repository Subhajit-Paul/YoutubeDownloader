name: Build Android APK

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      # Buildozer works best with Python 3.11 (3.13 support is experimental)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip zlib1g-dev \
            libgstreamer1.0-dev gstreamer1.0-plugins-base \
            libgstreamer-plugins-base1.0-dev \
            autoconf libtool pkg-config automake \
            libffi-dev libssl-dev \
            ccache

      - name: Install buildozer and cython
        run: pip install buildozer==1.5.0 cython==3.0.11

      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Build debug APK
        working-directory: android
        run: buildozer android debug
        env:
          # Speed up consecutive builds
          CCACHE_DIR: ${{ github.workspace }}/.ccache

      - name: Find built APK
        id: find_apk
        working-directory: android
        run: |
          APK=$(find bin -name "*.apk" | head -1)
          echo "apk_path=android/$APK" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename $APK)" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: false
