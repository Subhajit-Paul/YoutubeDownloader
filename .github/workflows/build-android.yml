name: Build Android APK

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6

      # Buildozer works best with Python 3.11 (3.13 support is experimental)
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git zip unzip zlib1g-dev \
            autoconf libtool pkg-config automake \
            libffi-dev libssl-dev \
            ccache

      - name: Install buildozer and cython
        run: pip install buildozer==1.5.0 cython==3.0.11

      - name: Cache buildozer global directory
        uses: actions/cache@v5
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('android/buildozer.spec') }}
          restore-keys: buildozer-${{ runner.os }}-

      # A release build is what makes android:debuggable false. Signing uses the
      # repo keystore when present; otherwise a throwaway key is generated so the
      # artefact is still installable for testing. Only a keystore-signed build
      # can be shipped to users, because upgrades require a stable signature.
      - name: Prepare signing key
        id: signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "alias=${{ secrets.ANDROID_KEYSTORE_ALIAS }}" >> "$GITHUB_OUTPUT"
            echo "storepass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_OUTPUT"
            echo "keypass=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_OUTPUT"
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.keystore" \
              -alias ci -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass cicicici -keypass cicicici \
              -dname "CN=CI Test Build, O=YoutubeDownloader, C=US"
            echo "alias=ci" >> "$GITHUB_OUTPUT"
            echo "storepass=cicicici" >> "$GITHUB_OUTPUT"
            echo "keypass=cicicici" >> "$GITHUB_OUTPUT"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; signed with a throwaway key. Test builds only."
          fi

      - name: Build release APK
        working-directory: android
        run: yes | buildozer android release
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/release.keystore
          P4A_RELEASE_KEYALIAS: ${{ steps.signing.outputs.alias }}
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ steps.signing.outputs.storepass }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ steps.signing.outputs.keypass }}

      - name: Find built APK
        id: find_apk
        working-directory: android
        run: |
          APK=$(find bin -name "*.apk" ! -name "*unsigned*" | head -1)
          [ -n "$APK" ] || APK=$(find bin -name "*.apk" | head -1)
          echo "apk_path=android/$APK" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename $APK)" >> "$GITHUB_OUTPUT"

      # Reports device-compatibility and security properties of the artefact.
      # Not --strict yet: several checks fail today and are tracked in the README.
      - name: Audit APK
        run: |
          pip install androguard
          python tools/check_apk.py "${{ steps.find_apk.outputs.apk_path }}" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: false
