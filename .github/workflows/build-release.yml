name: Build and Release (Desktop)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            artifact_suffix: linux-x86_64
          - os: windows-latest
            platform: windows
            artifact_suffix: windows-x86_64
          - os: macos-14
            platform: macos
            artifact_suffix: macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # ── Version ────────────────────────────────────────────────────────────
      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      # ── System deps ────────────────────────────────────────────────────────
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxcb-xinerama0 libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libgl1-mesa-dev libegl1 \
            dpkg-dev

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y

      - name: Exclude dist from Windows Defender (prevents quarantine of built EXEs)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}\dist"

      # ── macOS icon (sips is built-in, no deps needed) ─────────────────────
      - name: Create macOS icon (logo.icns)
        if: runner.os == 'macOS'
        run: |
          mkdir -p logo.iconset
          for size in 16 32 64 128 256 512; do
            sips -z $size $size logo.png --out logo.iconset/icon_${size}x${size}.png \
              >/dev/null 2>&1
          done
          iconutil -c icns logo.iconset -o logo.icns

      # ── ffmpeg ─────────────────────────────────────────────────────────────
      # A general-purpose build (BtbN's, and Homebrew's) is 140 MB and was 72%
      # of the TUI bundle and 44% of the desktop one, almost none of it
      # reachable from these apps: they mux video without re-encoding it and
      # transcode audio to one of six formats. build-ffmpeg.sh builds only
      # that. Keyed on the recipe, so a release that does not change it reuses
      # the binary instead of rebuilding.
      - name: Cache ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-out
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('packaging/ffmpeg/build-ffmpeg.sh') }}

      - name: Install ffmpeg build tools (Linux)
        if: runner.os == 'Linux' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: sudo apt-get install -y --no-install-recommends nasm

      - name: Install ffmpeg build tools (macOS)
        if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: brew install nasm

      - name: Install ffmpeg build tools (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            base-devel curl diffutils make tar
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-pkgconf

      - name: Build minimal ffmpeg (Linux, macOS)
        if: runner.os != 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash packaging/ffmpeg/build-ffmpeg.sh ffmpeg-out

      - name: Build minimal ffmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash packaging/ffmpeg/build-ffmpeg.sh ffmpeg-out

      # The specs pick ffmpeg up from the project root.
      - name: Stage ffmpeg for the build
        shell: bash
        run: |
          cp ffmpeg-out/ffmpeg* ./
          chmod +x ./ffmpeg 2>/dev/null || true
          ls -l ./ffmpeg* 

      # ── Python deps & PyInstaller build ────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements-build.txt

      - name: Check the built ffmpeg can do what the apps ask
        shell: bash
        run: python tools/check_ffmpeg.py ./ffmpeg

      - name: Create Windows icon (logo.ico)
        if: runner.os == 'Windows'
        shell: python
        run: |
          from PIL import Image
          img = Image.open("logo.png").convert("RGBA")
          img.save("logo.ico", format="ICO",
                   sizes=[(256,256),(128,128),(64,64),(32,32),(16,16)])

      - name: Build video downloader
        run: pyinstaller youtube-downloader.spec --noconfirm

      - name: Build audio downloader
        run: pyinstaller youtube-audio-downloader.spec --noconfirm

      - name: Build TUI downloader
        run: pyinstaller youtube-tui.spec --noconfirm

      # CI built three apps on three platforms and never started one of them.
      # A bundle whose shared libraries cannot be resolved dies at exec time,
      # before any Python runs — which is how a bad ICU stub presents, and the
      # stub is only exercised on Linux outside this job.
      - name: Smoke-launch the built apps
        shell: bash
        run: |
          python tools/smoke_launch.py dist/youtube-downloader
          python tools/smoke_launch.py dist/youtube-audio-downloader

      # The ICU stub and the plugin trim both degrade to a no-op rather than to
      # a broken build, so a missing compiler would ship a 111 MB bundle in
      # silence. Assert the trim actually happened.
      - name: Check the Qt payload was trimmed (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          icu=dist/youtube-downloader/_internal/PyQt5/Qt5/lib/libicudata.so.56
          test -f "$icu" || { echo "::error::$icu is missing entirely"; exit 1; }
          size=$(stat -c%s "$icu")
          echo "libicudata.so.56 is $size bytes"
          if [ "$size" -gt 1048576 ]; then
            echo "::error::ICU was not stubbed — the real table shipped ($size bytes)"
            exit 1
          fi
          total=$(du -sm dist/youtube-downloader | cut -f1)
          echo "bundle is ${total} MB"
          if [ "$total" -gt 100 ]; then
            echo "::error::bundle grew to ${total} MB; it was 89 MB with ffmpeg"
            exit 1
          fi

      # ── Linux: .deb for GUI apps; tar.gz binary for TUI ───────────────────
      - name: Create Linux packages
        if: runner.os == 'Linux'
        run: |
          chmod +x packaging/linux/make-deb.sh
          VERSION=${{ steps.version.outputs.version }}
          bash packaging/linux/make-deb.sh youtube-downloader       "YouTube Downloader"       "$VERSION"
          bash packaging/linux/make-deb.sh youtube-audio-downloader "YouTube Audio Downloader" "$VERSION"
          mkdir -p release
          mv "youtube-downloader_${VERSION}_amd64.deb" \
             "release/youtube-downloader-linux-x86_64.deb"
          mv "youtube-audio-downloader_${VERSION}_amd64.deb" \
             "release/youtube-audio-downloader-linux-x86_64.deb"
          tar -czf "release/youtube-tui-linux-x86_64.tar.gz" \
            -C dist youtube-tui

      # ── Windows: NSIS installers for GUI apps; raw .exe for TUI ───────────
      - name: Create Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH += ";C:\Program Files (x86)\NSIS"
          New-Item -ItemType Directory -Force -Path release | Out-Null
          makensis /NOCD /DVERSION=${{ steps.version.outputs.version }} packaging\windows\youtube-downloader.nsi
          makensis /NOCD /DVERSION=${{ steps.version.outputs.version }} packaging\windows\youtube-audio-downloader.nsi
          # onedir: the launcher needs its _internal tree beside it, so the
          # Windows TUI ships as a zip rather than a bare .exe.
          Compress-Archive -Path "dist\youtube-tui\*" -DestinationPath "release\youtube-tui-windows-x86_64.zip"

      # ── macOS: DMG ─────────────────────────────────────────────────────────
      - name: Create DMG packages (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg --quiet
          mkdir -p release
          SUFFIX=${{ matrix.artifact_suffix }}

          create-dmg \
            --volname "YouTube Downloader" \
            --volicon "logo.icns" \
            --window-size 600 300 \
            --icon-size 100 \
            --icon "YouTube Downloader.app" 150 150 \
            --app-drop-link 450 150 \
            --no-internet-enable \
            "release/youtube-downloader-${SUFFIX}.dmg" \
            "dist/YouTube Downloader.app"

          create-dmg \
            --volname "YouTube Audio Downloader" \
            --volicon "logo.icns" \
            --window-size 600 300 \
            --icon-size 100 \
            --icon "YouTube Audio Downloader.app" 150 150 \
            --app-drop-link 450 150 \
            --no-internet-enable \
            "release/youtube-audio-downloader-${SUFFIX}.dmg" \
            "dist/YouTube Audio Downloader.app"

          # TUI: tar.gz is more appropriate than .dmg for a CLI tool
          tar -czf "release/youtube-tui-${SUFFIX}.tar.gz" \
            -C dist youtube-tui

      # ── Upload ─────────────────────────────────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_suffix }}
          path: release/

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: ${{ matrix.platform == 'linux' }}
