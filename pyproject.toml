[project]
name = "youtubedownloader"
version = "1.1.1"
description = "Download video and audio from YouTube — Qt desktop apps, a TUI, and an Android build."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: exercises real downloads over a local HTTP server",
    "security: asserts a security property",
]
