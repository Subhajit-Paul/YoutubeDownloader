[project]
name = "youtubedownloader"
version = "1.6.0"
description = "Download video and audio from YouTube — Qt desktop apps, a TUI, and an Android build."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not network'"
markers = [
    "network: hits live YouTube; excluded by default, run with -m network",
    "integration: exercises real downloads over a local HTTP server",
    "security: asserts a security property",
]
